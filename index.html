    <script>
      // Ignore WebSocket / HMR connection errors in iframe environment
      window.addEventListener('unhandledrejection', function(event) {
        var reason = event && event.reason;
        var msg = (reason && (reason.message || reason.stack || String(reason))) || '';
        if (msg.includes('WebSocket') || msg.includes('ws') || msg.includes('@vite/client') || msg.includes('without opened')) {
          event.preventDefault();
          event.stopImmediatePropagation();
        }
      }, true);
      window.addEventListener('error', function(event) {
        var msg = (event && (event.message || '')) || '';
        var filename = (event && event.filename) || '';
        if (msg.includes('WebSocket') || filename.includes('@vite/client') || msg.includes('without opened')) {
          event.preventDefault();
          event.stopImmediatePropagation();
          return true;
        }
      }, true);
    </script>
